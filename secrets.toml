[groups.default.secrets.BEET_SSH_HOST_KEY]
role = "env_var"
note = "the site box's stable ssh host key, a base64 ed25519 private key the lightsail template renders onto the box at every deploy"
modified = "2026-09-21T02:25:35.219Z"
rotation = """
manual:ssh-keygen -t ed25519 -N '' -f host_key
> base64 -w0 host_key | beet secrets/set BEET_SSH_HOST_KEY --role=env_var, then deploy
> a new key changes the fingerprint every ssh client has pinned"""

[groups.default.secrets.CLOUDFLARE_API_TOKEN]
role = "env_var"
note = "cloudflare deployer token beet-deploy: the one hand-made Cloudflare credential, enough to provision the account (Account API Tokens: Edit is what lets an apply mint a bucket's own token)"
modified = "2026-09-21T02:25:35.940Z"
rotation = """
manual:https://dash.cloudflare.com/profile/api-tokens
> Create Token > Create Custom Token
> name: beet-deploy
> permission: Account > Account Settings > Read
> permission: Account > Workers Scripts > Edit
> permission: Account > Workers R2 Storage > Edit
> permission: Account > Workers KV Storage > Edit
> permission: Account > Workers Builds Configuration > Edit
> permission: Account > D1 > Edit
> permission: Account > Containers > Edit
> permission: Account > Cloudchamber > Edit
> permission: Account > Account API Tokens > Read
> permission: Account > Account API Tokens > Edit
> permission: Zone > DNS > Edit
> permission: Zone > Single Redirect > Edit
> permission: Zone > Workers Routes > Edit
> permission: Zone > Cache Purge > Edit
> permission: Zone > Cache Rules > Edit
> permission: Zone > Zone Settings > Edit
> Account Resources: your account
> Zone Resources: beet.org
> Continue to summary > Create Token"""

