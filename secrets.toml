[groups.default.secrets.R2_ACCESS_KEY_ID]
role = "env_var"
note = "r2 account token beet-r2, object read and write: the access key id"
modified = "2026-09-21T02:25:38.086Z"
rotation = """
manual:https://dash.cloudflare.com/?to=/:account/r2/api-tokens
> Create Account API Token
> name: beet-r2
> permission: Object Read & Write
> copy the Access Key ID (this) and the Secret Access Key (R2_SECRET_ACCESS_KEY)"""

[groups.default.secrets.R2_SECRET_ACCESS_KEY]
role = "env_var"
note = "the secret half of R2_ACCESS_KEY_ID, shown once at creation"
modified = "2026-09-21T02:25:38.789Z"
rotation = """
manual:https://dash.cloudflare.com/?to=/:account/r2/api-tokens
> with R2_ACCESS_KEY_ID: the same Create Account API Token mints both halves"""

[groups.default.secrets.TF_STATE_PASSPHRASE]
role = "env_var"
note = "opentofu client-side state encryption for every stack this repo declares (shared, the site, social): state carries what an apply derives"
modified = "2026-09-21T02:25:39.463Z"
rotation = """
manual:not re-mintable: losing it loses every stack's state, and a new one cannot read what the old one wrote
> rotating it is by hand, per stack: tofu state pull under the old passphrase
> beet secrets/set TF_STATE_PASSPHRASE --generate
> tofu state push under the new one (beet secrets/exec -- tofu -chdir=target/infra/<app> ..)"""

