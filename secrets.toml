[groups.default.secrets.TF_STATE_PASSPHRASE]
role = "env_var"
note = "opentofu client-side state encryption for every stack this repo declares (shared, the site, social): state carries what an apply derives"
modified = "2026-09-28T08:28:51.006Z"
rotation = """
manual:not re-mintable: losing it loses every stack's state, and a new one cannot read what the old one wrote
> beet secrets/set TF_STATE_PASSPHRASE_OLD --copy=TF_STATE_PASSPHRASE --role=env_var
> beet secrets/set TF_STATE_PASSPHRASE --generate --role=env_var --note=.. --rotation=.. (set keeps no metadata)
> rotate-state on every stack (just beet-shared, site-shared, beet-rotate-state --stage=prod, site-social --stage=prod); a stack still plaintext is encrypted by the same verb
> plan each stack straight after its own rotation: the plan is the proof the state still reads, and a silent failure would leave the next rotation operating on an unknown
> beet secrets/rm TF_STATE_PASSPHRASE_OLD once every stack has planned"""

