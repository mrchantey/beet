[groups.default.secrets.TF_STATE_PASSPHRASE]
role = "env_var"
note = "opentofu client-side state encryption for the root entry's stack (shared, the workspace assets bucket): state carries what an apply derives. site/ holds a copy of this value in its own document until it rolls its own"
modified = "2026-10-09T03:59:45.211Z"
roll = """
manual:not re-mintable: losing it loses the shared stack's state, and a new one cannot read what the old one wrote
> beet secrets/set TF_STATE_PASSPHRASE_OLD --copy=TF_STATE_PASSPHRASE --role=env_var
> beet secrets/set TF_STATE_PASSPHRASE --generate --role=env_var --note=.. --roll=.. (set restates the note and roll)
> roll-state on the stack (just beet-shared roll-state), then plan it: the plan is the proof the state still reads
> beet secrets/rm TF_STATE_PASSPHRASE_OLD once it has planned"""

