[groups.default.secrets.BEET_SSH_HOST_KEY]
role = "env_var"
note = "ssh host key of the site box (base64 of the ssh-keygen file): a local serve reads it here, and every full deploy of a stage writes it as the write-only value of the stack's tofu parameter /beet-site/<stage>/ssh-host-key (in no rendered config, plan or state), where the box reads it at each start"
modified = "2026-10-21T10:30:53.348Z"
roll = """
manual:ssh-keygen -t ed25519 -N '' -C beet-site -f <mode 700 tmp dir>/key
> base64 -w0 <dir>/key | beet secrets/set BEET_SSH_HOST_KEY --role=env_var --note=.. --roll=.. (set restates the note and roll), then delete the dir
> deploy each live stage (just beet-deploy, just beet-deploy --stage=prod): the full apply rewrites the stack's write-only parameter, versioned by this record's modified, and the release restarts the box onto it, no rebuild
> ssh-keygen -R app.beet.org (and app.dev.beet.org) for clients that pinned the old key"""

