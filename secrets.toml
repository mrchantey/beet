[groups.default.secrets.AWS_ACCESS_KEY_ID]
role = "env_var"
note = "aws deployer: the iam user's access key id; beet reads the pair from here, never from ~/.aws"
modified = "2026-09-20T09:19:48.310Z"
rotation = "manual:console.aws.amazon.com/iam > Users > <deployer> > Security credentials > Create access key; re-mint both halves together"

[groups.default.secrets.AWS_BEARER_TOKEN_BEDROCK]
role = "env_var"
note = "bedrock long-term api key"
modified = "2026-09-20T09:19:47.834Z"
rotation = "manual:console.aws.amazon.com/bedrock > API keys > Long-term > Generate"

[groups.default.secrets.AWS_REGION]
role = "env_var"
note = "the aws region a stack declaring none deploys into; a flag, read at declaration time"
modified = "2026-09-20T09:19:54.301Z"
rotation = "manual:a flag, never rotated; set it here or on the <Stack region>"

[groups.default.secrets.AWS_SECRET_ACCESS_KEY]
role = "env_var"
note = "aws deployer: the secret half of AWS_ACCESS_KEY_ID, shown once at creation"
modified = "2026-09-20T09:19:48.760Z"
rotation = "manual:with AWS_ACCESS_KEY_ID, the same Create access key"

[groups.default.secrets.BEET_SSH_HOST_KEY]
role = "env_var"
note = "the site box's stable ssh host key, a base64 ed25519 private key the lightsail template renders onto the box at every deploy"
modified = "2026-09-20T09:19:52.200Z"
rotation = "manual:ssh-keygen -t ed25519 -N '' -f host_key && base64 -w0 host_key; a new one changes the fingerprint every ssh client has pinned"

[groups.default.secrets.CLOUDFLARE_ACCOUNT_ID]
role = "env_var"
note = "the cloudflare account every block deploys into; an identifier, public in every dashboard url, read at declaration time"
modified = "2026-09-20T09:19:53.793Z"
rotation = "manual:dash.cloudflare.com > any zone > Overview > API > Account ID"

[groups.default.secrets.CLOUDFLARE_API_TOKEN]
role = "env_var"
note = "cloudflare deployer token beet-deploy: the one hand-made Cloudflare credential, enough to provision the account (Account API Tokens: Edit is what lets an apply mint a bucket's own token)"
modified = "2026-09-20T09:19:49.200Z"
rotation = "manual:dash.cloudflare.com/profile/api-tokens > Create Token > Create Custom Token > name beet-deploy > permissions Account Settings:Read, Workers Scripts:Edit, Workers R2 Storage:Edit, Workers KV Storage:Edit, Workers Builds Configuration:Edit, D1:Edit, Containers:Edit, Cloudchamber:Edit, Account API Tokens:Read+Edit, Zone DNS:Edit, Single Redirect:Edit, Workers Routes:Edit, Cache Purge:Edit, Cache Rules:Edit, Zone Settings:Edit > Account Resources = your account, Zone Resources = your zone > Continue To Summary > Create Token"

[groups.default.secrets.CLOUDFLARE_ZONE_ID]
role = "env_var"
note = "the beet.org zone every dns block writes into; an identifier, read at declaration time"
modified = "2026-09-20T09:19:54.047Z"
rotation = "manual:dash.cloudflare.com > beet.org > Overview > API > Zone ID"

[groups.default.secrets.GEMINI_API_KEY]
role = "env_var"
note = "gemini api key"
modified = "2026-09-20T09:19:47.426Z"
rotation = "manual:aistudio.google.com/apikey > Create API key"

[groups.default.secrets.OPENAI_API_KEY]
