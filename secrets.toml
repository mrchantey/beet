rotation = """
manual:https://console.anthropic.com/settings/keys
> Create Key"""

[groups.default.secrets.AWS_ACCESS_KEY_ID]
role = "env_var"
note = "aws deployer `beet-deployer`: the access key id of this repo's own iam user; the deploy verbs and every `aws s3 sync` read the pair from here, never from ~/.aws"
modified = "2026-09-27T05:14:28.979Z"
rotation = """
manual:beet deployer/mint --rotate
> with an admin pair in the environment, which wins over this document: `AWS_ACCESS_KEY_ID=.. AWS_SECRET_ACCESS_KEY=.. beet deployer/mint --rotate`
> both halves are minted, sealed and proven together, then the old key is deleted"""

[groups.default.secrets.AWS_BEARER_TOKEN_BEDROCK]
role = "env_var"
note = "bedrock long-term api key; beet_thread's bedrock tests read it"
modified = "2026-09-21T02:25:34.519Z"
rotation = """
manual:https://console.aws.amazon.com/bedrock/home#/api-keys
> API keys > Long-term > Generate"""

[groups.default.secrets.AWS_SECRET_ACCESS_KEY]
role = "env_var"
note = "aws deployer `beet-deployer`: the secret half of AWS_ACCESS_KEY_ID, shown once at creation"
modified = "2026-09-27T05:14:28.979Z"
rotation = """
manual:beet deployer/mint --rotate
> with an admin pair in the environment, which wins over this document: `AWS_ACCESS_KEY_ID=.. AWS_SECRET_ACCESS_KEY=.. beet deployer/mint --rotate`
> both halves are minted, sealed and proven together, then the old key is deleted"""

[groups.default.secrets.BEET_SSH_HOST_KEY]
role = "env_var"
note = "the site box's stable ssh host key, a base64 ed25519 private key the lightsail template renders onto the box at every deploy"
modified = "2026-09-21T02:25:35.219Z"
rotation = """
manual:ssh-keygen -t ed25519 -N '' -f host_key
> base64 -w0 host_key | beet secrets/set BEET_SSH_HOST_KEY --role=env_var, then deploy
> a new key changes the fingerprint every ssh client has pinned"""

[groups.default.secrets.CLOUDFLARE_API_TOKEN]
role = "env_var"
note = "cloudflare deploy token `beet-deploy` (cdd8a4f159521e2408404b2d34709909): account-owned, scoped to exactly what this repo's stacks and routes declare; every tofu apply, wrangler call and zone verb reads it from here"
modified = "2026-10-05T06:44:23.970Z"
rotation = """
manual:beet cloudflare/mint --rotate
> with the mint token in the environment, which wins over this document: `CLOUDFLARE_API_TOKEN=.. beet cloudflare/mint --rotate`
> the mint token holds `Account API Tokens Write` and nothing else, and lives in the password manager rather than in any document: it is the one credential the age key must not open
> the new token is minted, proven with a read this repo's deploy makes and sealed, then the token it replaces is deleted"""

[groups.default.secrets.GEMINI_API_KEY]
