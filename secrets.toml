[groups.default.secrets.TF_STATE_PASSPHRASE]
role = "env_var"
note = "opentofu client-side state encryption for every stack this repo declares (shared, the site, social): state carries what an apply derives"
modified = "2026-09-25T02:00:18.324Z"
rotation = """
manual:not re-mintable: losing it loses every stack's state, and a new one cannot read what the old one wrote
> pbkdf2 keys its salt by provider name, so a swap goes through OpenTofu's plaintext bridge, per encrypted stack, from a work dir initialised under the old value (tofu init reads the state); every tofu call as `beet secrets/exec -- sh -c 'TF_VAR_tf_state_passphrase=$TF_STATE_PASSPHRASE tofu -chdir=target/infra/<app> ..'`
> 1. in target/infra/<app>/main.tf.json set state.method=method.unencrypted.migrate with fallback method.aes_gcm.main (method.unencrypted.migrate={}); state pull > <0600 file>; bump its serial; state push under the OLD value
> 2. beet secrets/set TF_STATE_PASSPHRASE --generate --role=env_var --note=.. --rotation=.. (set keeps no metadata)
> 3. flip the edit (method=method.aes_gcm.main, fallback=method.unencrypted.migrate); bump the serial again; state push under the NEW value; a validate per stack proves it reads back; a plaintext stack needs step 3 alone"""

