[groups.default.secrets.BEET_SSH_HOST_KEY]
role = "env_var"
note = "ssh host key of the site box (base64 of the ssh-keygen file): a local serve reads it here, every full deploy of a stage mirrors it to /beet-site/<stage>/ssh-host-key, where the box reads it at each start"
modified = "2026-10-15T10:00:10.393Z"
roll = """
manual:ssh-keygen -t ed25519 -N '' -C beet-site -f <mode 700 tmp dir>/key
> base64 -w0 <dir>/key | beet secrets/set BEET_SSH_HOST_KEY --role=env_var --note=.. --roll=.. (set restates the note and roll), then delete the dir
> deploy each live stage (just beet-deploy, just beet-deploy --stage=prod): the full apply mirrors the record into the stack and the release restarts the box onto it, no rebuild
> ssh-keygen -R app.beet.org (and app.dev.beet.org) for clients that pinned the old key"""

