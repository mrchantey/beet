[package]
name = "beet-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
readme.workspace = true
description = "Tools for building and deploying beet apps"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
keywords.workspace = true
[[bin]]
name = "beet"
path = "src/main.rs"

[features]
## All features added/removed here must be reflected in `crates/beet-cli/src/entry_build.rs crate_registration!`
default = ["qrcode", "net", "tui", "ssh", "thread", "pdf"]
qrcode = ["dep:qrcode", "dep:image"]
# Offline geoip country lookup for analytics, so a served/deployed site derives a
# visitor country (needs a `country.mmdb` in `assets/databases/`). Opt-in, so a
# plain dev build never links `maxminddb`. Deployed via `<BeetBinaryBuild
# features="..,geoip"/>` in the site entry.
geoip = ["beet/geoip"]
# `beet export-pdf` page concatenation: pulls `lopdf` to merge the per-route
# prints into one document. Optional so a build that only emits separate
# per-route PDFs (or skips the command) never links `lopdf`.
pdf = ["dep:lopdf"]
# The `beet_extra` example capabilities (`BeetExtraPlugin`): the example
# actions/tools/templates the demo `.bsx` entries name (eg `<CalculatorToolset/>`,
# `<StackHost>`, the perceive-act agent). Explicit opt-in: `thread`/`infra` link
# their runtimes without it, and a demo entry declares
# `<CrateCheck features="..,extra"/>`. The facade's `thread`/`infra` weakly
# forward the matching `beet_extra` sub-feature, so co-enabling this lights the
# relevant example set up.
extra = ["beet/extra"]
# The agent-thread runtime + its charcell chat UI, so a `main.bsx` declaring a
# `<Thread>` chat (eg `examples/thread/chat.bsx`) loads and runs through the one
# `beet` binary. Pulls `beet/ui` so `ThreadUiPlugin` (the `ThreadView` document
# chain) and the charcell host are present. Example tools (eg the `tool_call`
# demo's inline tool) ride the separate `extra` feature.
thread = ["beet/thread", "beet/ui"]
# The cloudflare/aws deploy blocks + route actions, so one `beet` binary runs an
# infra deployer `.bsx` (eg `examples/infra/cloudflare_workers.bsx deploy`).
# Opt-in (like `winit`), so a plain `beet serve` never links the deploy
# machinery. The example deploy templates (`<StackHost>`, `<SiteBucket>`, ...)
# ride the separate `extra` feature. Run with:
# `cargo run -p beet-cli --features infra,extra -- --main=examples/infra/cloudflare_workers.bsx deploy`.
infra = ["beet/cloudflare_block", "beet/lambda_block", "beet/lightsail_block", "beet/fargate_block", "beet/aws_sdk"]
# The windowed render stack, so one `beet` binary runs a wgpu scene `.bsx` (which
# spawns its own `Window`) and a headless server `.bsx` from the same build. Pulls
# `beet/examples` (winit + bevy_default + spatial + `extra`), so `BeetPlugins` adds
# `BeetExtraPlugin` and `beet/bevy_default` forwards `beet_extra/bevy_default` (the
# example component types + scene templates). The binary owns the window lifecycle +
# screenshot harness here (`render_window_plugin`, in `src/render.rs`), so this
# feature also gates that module. Opt-in, so deploy/headless builds never link wgpu.
# The ml stack (burn + the shared wgpu device) is split into the `ml` feature, so a
# windowed spatial scene builds without it.
# Run a spatial scene with: `cargo run -p beet-cli --features winit -- --main=<scene.bsx>`.
winit = [
	"beet/examples",
]
# The burn ML backend + the ml example types/scenes, sharing bevy's wgpu device via
# `SharedBurnWgpuPlugin` rather than a second wgpu instance. Requires `winit` (the
# windowed stack the ml scenes draw into); `beet/ml` forwards `beet_extra/ml`, whose
# scene/template registrations are `#[cfg(feature = "ml")]`-gated, so `winit` alone
# excludes them.
# Run an ml scene with: `cargo run -p beet-cli --features winit,ml -- --main=<scene.bsx>`.
ml = ["winit", "beet/ml"]
# HTTP transport for the remote scene-control commands. Native-only: the
# ureq/rustls stack does not build on wasm, so it is enabled via the non-wasm
# target table below rather than wired into this feature directly.
net = ["beet/ureq","beet/rustls-tls"]
# The websocket socket-server + client backend (tungstenite), so a markup
# `{SocketServer}` boots and `Socket::connect` works, eg the perceive-act agent and
# its in-process head/body clients. Opt-in (like `winit`), so a plain `beet serve`
# never links tungstenite. Run with:
# `cargo run -p beet-cli --features sockets -- --main=examples/perceive_act/main-v1.bsx --server=socket`.
sockets = ["beet/tungstenite"]
# TLS serving (the `Tls` component): https/wss with a generated self-signed
# dev cert, so LAN devices get a secure context (webcam, mic).
secure = ["beet/secure"]
# The live terminal target for `beet present`: the navigable charcell host and
# the markup-declarable `TuiServer` (`beet/tui_server` pulls `beet_router/tui`,
# which registers it). On by default so a bare `beet present` boots the deck.
tui = ["beet/tui_server"]
# The multi-tenant SSH-TUI server (`SshTuiServer`), so `beet serve <site>
# --server=http,ssh` serves http and an ssh terminal from one process. Registers
# the markup-declarable `SshTuiServer` via `SshTuiPlugin`.
ssh = ["tui", "beet/ssh_tui"]
# S3-backed stores, so a deployed `beet` task loads its entry (`main.bsx`,
# `routes/`, `templates/`) from an S3 bucket instead of the local filesystem,
# selected at runtime by `--store=s3://<bucket>`. Adds no deploy/terraform
# machinery, keeping the container binary lean.
aws_sdk = ["beet/aws_sdk"]
# The AWS Lambda backend: builds the generic `beet` binary as a `provided.al2023`
# function (the lambda http backend wins server selection over the mini server).
# Pulls `aws_sdk` so the deployed function loads its site from S3 at request time.
lambda = ["beet/lambda", "beet/aws_sdk"]
# The Cloudflare Worker target (wasm32-only): builds the `beet-cli` lib as a
# `cdylib` Worker that loads its site from an R2 bucket and serves it through the
# render router. Pulls `beet/cloudflare` (the portable render router + the R2
# store backend) plus the wasm Worker SDK; see `lib.rs`'s `#[event(fetch)]` entry.
# Build with: `cargo build --target wasm32-unknown-unknown -p beet-cli --lib \
# --no-default-features --features cloudflare`.
# `console_error_panic_hook` is an unconditional wasm dep (the standalone binary
# uses it too), so it is not a `dep:` activation here.
cloudflare = ["beet/cloudflare", "dep:worker"]
# The browser-wasm target (wasm32-only): builds the standalone `beet` binary for
# the browser, which boots, reads its program from a `<script type="application/x-bsx">`
# in the DOM (`js_runtime::environment() == Browser`), runs it headless and logs to
# the console. The wasm-safe render base, no Worker SDK. `BuildWasm` defaults to this.
# Build with: `cargo build --target wasm32-unknown-unknown -p beet-cli --bin beet \
# --no-default-features --features web --profile wasm-release`.
web = ["beet/web"]
# The browser-wasm target plus the wasm-safe action/behaviour/utility-AI example
# types (`ActionExamplesPlugin` via `extra`), so the browser binary runs the
# richer `examples/action/*.bsx` programs (eg malenia.bsx), not just the
# Sequence/Log core. Stays wasm-clean: `beet/extra` pulls no winit/wgpu/bevy_default.
web_examples = ["web", "extra"]
# The browser-wasm target plus the perceive-act wasm head (`<WebHead>` + its webcam /
# speech / face handlers, via `beet/perceive_act_web`), so the browser binary serves as
# the perceive-act head client (v3). Wasm-safe: no `thread` (the native LLM agent runs in
# the separate native binary serving this head over a socket). Build with:
# `beet build-wasm --package=beet-cli --bin=beet --features=web_head --out=<path>.wasm`.
web_head = ["web", "beet/perceive_act_web"]
# `beet-min.wasm`, the floor: the smallest binary that is still a beet runtime in
# the browser, ie the `web` base and nothing else. It boots, reads its program from
# the DOM and runs it, so a page whose program sticks to the core vocabulary
# (`<Sequence>`, `<Log>`, `CallOnLoad`) mounts this. Anything a program names beyond
# that needs a larger set. Build with: `just build-wasm-min`.
web_min = ["web"]
# `beet-full.wasm`, the ceiling: every feature a browser binary can actually boot
# with, so any `.bsx` whose types are wasm-safe runs from it — the example surface,
# the perceive-act head, the agent thread runtime, the charcell tui host, the infra
# block definitions, and the embedded JavaScript engine.
# Three exclusion groups, each for its own reason:
# - `winit`/`ml`/`bevy_default`: the render stack does not boot in a browser tab yet,
#   verified both ways. With `winit`, `BeetPlugins` picks the winit runner (wasm has
#   no `DISPLAY` concept, so `has_display()` is `true`), which owns the event loop and
#   never returns to the awaited `start()`, hanging the tab. Without it, the headless
#   runner is `MinimalPlugins`, so the asset-dependent plugins `bevy_default` switches
#   on panic at boot on a missing `AssetServer`. Both need a wasm windowed-boot path,
#   not a feature list.
# - `cloudflare`: a different artifact entirely (the Worker `cdylib`), not a browser
#   binary.
# - `net`/`sockets`/`secure`/`ssh`/`aws_sdk`/`lambda` (the native transports, gated
#   away in beet_net on wasm) and `qrcode`/`pdf` (whose deps sit in this manifest's
#   own `not(wasm32)` table): all compile, and all add exactly zero packages to the
#   wasm graph, so naming them would claim a capability the artifact does not have.
# Between the two ends is where narrower sets belong (a head-only build, a render
# build once one boots); add them as artifacts of their own rather than widening
# `min`.
web_full = [
	"web_min",
	"web_examples",
	"web_head",
	"tui",
	"thread",
	"infra",
	"geoip",
	"beet/quickjs",
]

# the portable cross-platform base: the render router stack, media negotiation and
# the runtime BSX parser the no-code site needs, on both native and wasm. beet's
# default features (`std`, `ui`) are cross-platform, so they ride along.
[dependencies]
beet = { workspace = true, features = [
	"json",
	"template_serde",
	"markdown",
	"style",
	"template",
	# plaintext `MediaType::Text` serialization, so a scripted route's `String`
	# output streams raw (`result: 7`) instead of JSON-quoted under the cli accept.
	"serde_plain",
] }

# the native binary's full surface: the std router + server, the dev-command
# infra, webdriver, the live-reload client channel, and the QuickJS runtime.
# These do not build on wasm, so they ride the non-wasm target table; cargo merges
# features per active target, so the native bin gets them while the wasm lib does not.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
beet = { workspace = true, features = [
	"router",
	"fs",
	"infra",
	# Cloudflare DNS for the AWS blocks, so the root `main.bsx` beet-site deployer
	# resolves `<FargateBeetSiteBlock>`'s `DnsProvider::cloudflare` records.
	"cloudflare_dns",
	"webdriver",
	# the `serve` command spawns and serves a no-code BSX site
	"http_server",
	# `beet serve --watch`: dev-mode live reload over the client_io channel
	"client_io",
	# fenced code blocks in served/presented decks render highlighted
	"syntax_highlighting",
	# the embedded QuickJS engine: the `ExchangeScriptElement` console-capturing
	# entry action and the `ExchangeScript` route backend a `main.bsx` wires.
	"quickjs",
] }
# `export-pdf` merges the per-page PDFs a headless browser prints into one
# document; pulled only by the `pdf` feature.
lopdf = { version = "0.36", optional = true }
qrcode = { version = "0.14", optional = true }
image = { version = "0.25", optional = true }

# the wasm target's extra deps. The portable render router rides every wasm build
# (both the standalone `beet` binary and the Cloudflare Worker): `beet/router` is
# the cross-platform render/server stack the cloudflare build already proves
# wasm-clean, and cargo merges these features with the base `beet` dep, so the wasm
# bin gets json/template_serde/markdown/style/template/serde_plain *plus* router.
# The Workers SDK + a panic hook stay optional, pulled only by the `cloudflare`
# feature; the standalone binary uses `console_error_panic_hook` directly so it is
# not optional here.
[target.'cfg(target_arch = "wasm32")'.dependencies]
beet = { workspace = true, features = ["router"] }
worker = { workspace = true, optional = true }
console_error_panic_hook = { workspace = true }
# the binary's exported async `start` entry the host (deno.ts / the browser
# `<Wasm>` loader) awaits for the exit code; `-futures` bridges the async fn
# into the returned JS promise.
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }

[dev-dependencies]
beet = { workspace = true, features = ["testing"] }

# the `beet` test runner replaces libtest's harness. `cdylib` builds the wasm
# Worker (the Cloudflare target), `rlib` keeps the native `beet` bin linking the lib.
[lib]
harness = false
crate-type = ["cdylib", "rlib"]
