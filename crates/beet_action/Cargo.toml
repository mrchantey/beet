[package]
name = "beet_action"
version.workspace = true
edition.workspace = true
description = "Entities as async functions."
documentation.workspace = true
readme = "README.md"
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["std", "reflect"]
# The typed `Script` marshals through JSON, which is `no_std` with alloc, so
# `std` is no part of the scripting story.
# `beet_core/fs` brings the native `ChildProcess` primitive the `Command` action
# spawns (process + cwd/env), itself native-only (it pulls async-process/notify).
std = ["beet_core/std", "beet_core/fs", "rquickjs?/std"]
serde = ["dep:serde", "beet_core/serde", "bitflags/serde"]
json = ["serde", "dep:serde_json", "beet_core/json"]
template_serde = ["beet_core/template_serde"]
reflect = ["beet_core/bevy_reflect_documentation"]
# The engine-agnostic `Script` / `ScriptAction` surface: a JavaScript program as
# data, plus the backend selection that runs it. A `Script` always marshals its
# input/output, and JSON is the wire currency of every backend, so this pulls
# `json` (serde_json, `no_std` with alloc) rather than leaving a half-built
# `Script` that cannot talk to any of them. Backend-free on its own: a build with
# `scripting` and no backend compiles, and errors when a script is run.
# The remaining `dep:` entries are the host-realm backends' transports (async
# stdio natively, the Worker/iframe bindings on wasm). Each is inert on the
# target whose table does not declare it, and a wasm build without `scripting`
# pays for none of the web-sys bindings — which is the point, since binary size
# is the whole reason the iframe backend exists.
# `beet_core/rsx` is the `#[template]` macro, which the `<RunScript>` markup
# front-end is; it enables a macro feature and pulls no extra dependency.
scripting = [
	"serde",
	"json",
	"beet_core/rsx",
	"dep:futures-lite",
	"dep:js-sys",
	"dep:wasm-bindgen",
	"dep:async-channel",
	"dep:web-sys",
]
# The embedded QuickJS engine, the primary backend, plus `exports::rquickjs`.
# Serves every target including wasm, from the same engine code: the two `dep:`
# entries are the same crate from two sources (see the target tables below), and
# a `dep:` naming a dependency whose target table does not apply is inert.
quickjs = ["scripting", "dep:rquickjs", "dep:rquickjs_wasm"]

[dependencies]
beet_core = { workspace = true, default-features = false, features = ["bevy_async"] }
bevy = { workspace = true, features = ["bevy_color"] }
bitflags.workspace = true
# async stdio for the deno-cli scripting backend: the child's module source is
# written to its stdin and its protocol events are read back line by line.
futures-lite = { workspace = true, optional = true }
extend.workspace = true
thiserror.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

# QuickJS on native: pristine crates.io rquickjs.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rquickjs = { workspace = true, optional = true }

# QuickJS on wasm: a fork adding `wasm32-unknown-unknown` (the upstream crate
# builds its C engine for native and wasi only). Cargo forbids one dependency
# name having different sources per target, so the wasm arm is a renamed key
# aliased back in `quickjs_backend.rs` — every line of engine code reads
# `rquickjs::` on both targets.
#
# Declared here rather than in the workspace table for the same name-collision
# reason, and no other crate consumes it. Cargo fetches the git dep and its
# submodules itself, so a beet developer sets up nothing.
#
# Swap this line in to develop against a local clone of the fork:
# rquickjs_wasm = { package = "rquickjs", path = "../../../quickjs", optional = true, default-features = false, features = ["rust-alloc"] }
[target.'cfg(target_arch = "wasm32")'.dependencies]
rquickjs_wasm = { package = "rquickjs", git = "https://github.com/mrchantey/rquickjs", branch = "wasm32-unknown-unknown", optional = true, default-features = false, features = ["rust-alloc"] }
# `js-sys` covers both scripting axes on wasm: the embedded engine's one host
# import (the clock) and the host backends' JS plumbing.
js-sys = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
# the host-realm scripting backends: a `permissions: "none"` Worker under deno,
# a sandboxed iframe in a browser. Both talk the script protocol over
# postMessage, which reaches the awaiting future through an async channel.
async-channel = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = [
	"Blob",
	"BlobPropertyBag",
	"Document",
	"Element",
	"EventTarget",
	"HtmlIFrameElement",
	"MessageEvent",
	"Url",
	"Window",
	"Worker",
	"WorkerOptions",
	"WorkerType",
] }

[dev-dependencies]
beet_action = { path = ".", features= ["template_serde", "scripting"] }
beet_core = { workspace = true, features = ["testing", "ron"] }

[lib]
harness = false
