[package]
name = "beet_infra"
version.workspace = true
edition.workspace = true
authors.workspace = true
documentation.workspace = true
license.workspace = true
readme.workspace = true
description = "Terraform configuration represented as high level Bevy scenes"
repository.workspace = true


[features]
# The two blocks that carry a runtime meaning as well as a deploy one (an app
# bucket the binary reads, an analytics table it writes) are declared in the
# *application's* markup, so they must resolve in an ordinary build rather than
# only in a deployer build. `--no-default-features` still strips them.
default = ["bindings_aws_common", "bindings_aws_dynamo"]
bindings_generator = ["tokens","prettyplease","beet_core/tokens"]
tokens = ["proc-macro2", "quote", "syn"]
aws_sdk = ["beet_net/aws_sdk"]
deploy = ["beet_router", "dep:base64"]
# enables `beet_router`, unlocking the route actions (eg `build-wasm`) that need
# it for dispatch.
beet_router = ["dep:beet_router"]
lambda_block = ["bindings_aws_common","bindings_aws_lambda","bindings_aws_acm","bindings_aws_dns"]
lightsail_block = ["bindings_aws_common","bindings_aws_lightsail","bindings_aws_dns"]
fargate_block = ["bindings_aws_common","bindings_aws_dynamo","bindings_aws_fargate","bindings_aws_acm","bindings_aws_dns","vpc_block"]
# The network every AWS compute block sits in: vpc, public + private subnets,
# internet gateway and the security-group handles a consumer names.
vpc_block = ["bindings_aws_vpc"]
# The company Postgres instance, in the private subnets of a `vpc_block` vpc.
rds_postgres_block = ["vpc_block", "bindings_aws_rds"]
# Opt-in Cloudflare DNS + load-balancer failover paths for the AWS blocks. Pulls
# the cloudflare terraform bindings; without it the AWS blocks are Route53-only.
# Also pulls `bindings_aws_dns`: enabling this compiles the shared `dns` module
# whose always-present `Route53` variant needs the Route53 binding.
cloudflare_dns = ["bindings_cloudflare_common", "bindings_aws_dns"]
# The Cloudflare Containers + Workers blocks/actions. Wrangler-provisioned, so no
# terraform bindings; needs `deploy` (the actions) and `aws_sdk` (the container's
# `S3Store::r2` path) at the consumer.
cloudflare_block = []
# The self-hosted mail stack: the per-domain DNS + SES declaration
# (`MailDomainBlock`), the box that serves it (`StalwartBlock`, hence the ec2,
# ssm and iam/common bindings) and the member/mailbox/alias inputs both are
# authored from. Cloudflare holds the zone every record lands in, hence
# `cloudflare_dns`.
mail = [
	"bindings_aws_ses",
	"bindings_aws_dns",
	"bindings_aws_ec2",
	"bindings_aws_ssm",
	"bindings_aws_common",
	"cloudflare_dns",
	"vpc_block",
	"rds_postgres_block",
]
bindings_aws_common = []
bindings_aws_dynamo = []
bindings_aws_dns = []
bindings_aws_acm = []
bindings_aws_lightsail = []
bindings_aws_lambda = []
bindings_aws_fargate = []
# The mail stack's EC2 box: instance, EIP (+ association), keypair, instance
# profile and the role policy attached to it.
bindings_aws_ec2 = []
# The mail stack's RDS Postgres instance and its subnet group.
bindings_aws_rds = []
# The network resources every AWS compute block sits in: vpc, subnets, internet
# gateway, route tables and security groups. Their own file rather than the
# fargate one they started in, since a vpc is not an ECS thing.
bindings_aws_vpc = []
# SES v2 sending identities, their custom MAIL FROM attributes, and
# configuration sets.
bindings_aws_ses = []
# SSM Parameter Store, for secrets (`EnsureSecret`) and non-secret config the
# mail box fetches at boot.
bindings_aws_ssm = []
bindings_aws_all = [
	"bindings_aws_common",
	"bindings_aws_dynamo",
	"bindings_aws_dns",
	"bindings_aws_acm",
	"bindings_aws_lightsail",
	"bindings_aws_lambda",
	"bindings_aws_fargate",
	"bindings_aws_ec2",
	"bindings_aws_rds",
	"bindings_aws_ses",
	"bindings_aws_ssm",
	"bindings_aws_vpc",
]
bindings_cloudflare_common = []

[[bin]]
name = "bindings"
path = "src/bin/bindings.rs"
required-features = ["bindings_generator"]

[dependencies]
beet_core = { workspace = true, features = ["std", "json", "rand", "fs"] }
beet_net = { workspace = true, features = ["std", "serde", "fs", "http"] }
bytes.workspace = true
beet_action = { workspace = true, features = ["std", "reflect", "json"] }
beet_router = { workspace = true, optional = true, features = ["json"] }
serde.workspace = true
# `std` for `to_writer_pretty` and the `io`-based serializers.
serde_json = { workspace = true, features = ["std"] }
heck.workspace = true
# not optional: a block's machine-config digest (`LightsailBlock::machine_config_hash`)
# decides whether a deploy rebuilds the box, so it must render on every target.
sha2 = { workspace = true }
base64 = { workspace = true, optional = true }

thiserror = { workspace = true }
proc-macro2 = { workspace = true, optional = true }
quote = { workspace = true, optional = true }
syn = { workspace = true, optional = true }
prettyplease = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
async-process = { workspace = true }

[dev-dependencies]
beet_net = { workspace = true, features = ["std", "serde", "fs", "http", "ureq", "rustls-tls", "server", "russh_client"] }
beet_router = { workspace = true, features = ["http"] }
beet_core = { workspace = true, features = ["testing"] }
pretty_env_logger.workspace = true
beet_infra = { path = ".", features = [
	"deploy",
	"aws_sdk",
	"bindings_generator",
	"bindings_aws_dns",
	"lambda_block",
	"lightsail_block",
	"fargate_block",
	"cloudflare_dns",
	"mail",
] }

[[example]]
name = "lambda_test"
path = "examples/lambda_test.rs"
required-features = ["deploy", "aws_sdk", "lambda_block"]

[[example]]
name = "lightsail_test"
path = "examples/lightsail_test.rs"
required-features = ["deploy", "aws_sdk", "lightsail_block"]

[[example]]
name = "fargate_test"
path = "examples/fargate_test.rs"
required-features = ["deploy", "aws_sdk", "fargate_block"]

[lib]
harness = false

[[test]]
name = "fargate"
path = "tests/fargate.rs"
harness = false

[[test]]
name = "site_load_test"
path = "tests/site_load_test.rs"
harness = false

[[test]]
name = "lambda"
path = "tests/lambda.rs"
harness = false

[[test]]
name = "lightsail"
path = "tests/lightsail.rs"
harness = false

[[test]]
name = "runtime_utils"
path = "tests/runtime_utils.rs"
harness = false
