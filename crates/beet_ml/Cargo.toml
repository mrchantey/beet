[package]
name = "beet_ml"
version.workspace = true
edition.workspace = true
description = "Machine Learning actions built upon beet_action"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["wgpu", "spatial"]
bevy_default = ["bevy/default", "beet_core/bevy_default"]
spatial = ["dep:beet_spatial"]

# burn backends — exactly one should be active for the host target.
wgpu = ["burn/wgpu"]
# burn's pure-Rust CPU backend, for a host with no usable GPU
flex = ["burn/flex"]
# cuda requires a system cuda install (arch linux: pacman -S cuda)
cuda = ["burn/cuda"]

[dependencies]
beet_action = { workspace = true, features = ["std", "reflect"] }
beet_core = { workspace = true, features = ["std", "rand", "fs", "json"] }
beet_net = { workspace = true, features = ["std", "serde", "fs", "http", "ureq", "rustls-tls"] }
beet_spatial = { workspace = true, optional = true, features = ["std"] }

bevy = { workspace = true, features = ["bevy_asset"] }

burn = { version = "0.22", default-features = false, features = ["std", "linalg"] }
burn-store = { version = "0.22", default-features = false, features = ["std", "safetensors"] }
tokenizers = { version = "0.23", default-features = false, features = ["unstable_wasm"] }

# Never named in code, and for every target: burn's autotune cache (cubecl
# `persistence`, always on via `cubecl-wgpu`) pulls `turso`, whose `turso_core`
# takes `branches` without `std` natively and on wasm alike, and that path calls
# `core::intrinsics::abort` on nightly, removed from it in 2026-11. `std` routes
# `branches::abort` through `std::process::abort` instead.
branches = { version = "0.4", default-features = false, features = ["std"] }

futures.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
strum.workspace = true
strum_macros.workspace = true
thiserror.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook.workspace = true
# `bevy_default` pulls the rand 0.10 of `bevy_math`/`bevy_shape`, hence getrandom
# 0.4; enable its WebCrypto backend so a wasm build links. beet_core covers 0.3 for
# every crate.
getrandom = { workspace = true }

[dev-dependencies]
beet_core = { workspace = true, features = ["testing"] }
pretty_env_logger.workspace = true

[lib]
harness = false

[[example]]
name = "hello_rl_basic"
path = "examples/hello_rl_basic.rs"
required-features = ["bevy_default"]

[[example]]
name = "hello_ml_basic"
path = "examples/hello_ml_basic.rs"
