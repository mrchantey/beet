[package]
name = "beet_spatial"
version = { workspace = true }
edition = { workspace = true }
description = "Spatial actions built upon beet_action"
documentation = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }

[features]
default = ["std"]
std = ["beet_core/std", "beet_action/std"]
bevy_default = ["bevy/default", "beet_core/bevy_default"]

[dependencies]
beet_action.workspace = true
beet_core = { workspace = true, default-features = false, features = ["bevy_async", "rand"] }

# `bevy_curve` puts the curves `procedural_animation` samples (`Curve`,
# `EasingCurve`, `EaseFunction`, `FunctionCurve`, `Interval`) into the prelude.
bevy = { workspace = true, features = ["bevy_curve"] }

extend.workspace = true
log.workspace = true
strum.workspace = true
strum_macros.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys.workspace = true

[dev-dependencies]
beet_core = { workspace = true, features = ["testing"] }

[lib]
harness = false
