[package]
name = "beet_core"
version.workspace = true
edition.workspace = true
authors.workspace = true
documentation.workspace = true
license.workspace = true
readme.workspace = true
description = "Core utilities and types for other beet crates"
repository.workspace = true


# Stable test runner uses `inventory` + a `beet_core::test_main!()` entry
# point, so libtest's harness is disabled everywhere except `test_test`
# (the nightly `custom_test_frameworks` demonstrator, default harness).
[lib]
harness = false

[[example]]
name = "to_tokens"
path = "examples/to_tokens.rs"
required-features = ["tokens"]

[[test]]
name = "to_tokens"
path = "tests/to_tokens.rs"
required-features = ["tokens"]
harness = false

[[test]]
name = "bundle_effect"
path = "tests/bundle_effect.rs"
harness = false

[[test]]
name = "rsx"
path = "tests/rsx.rs"
required-features = ["rsx", "testing", "serde"]
harness = false

[[test]]
name = "component_lifecycle"
path = "tests/component_lifecycle.rs"
harness = false

[[test]]
name = "component_lifecycle2"
path = "tests/component_lifecycle2.rs"
harness = false

[[test]]
name = "env_ext"
path = "tests/env_ext.rs"
harness = false

[[test]]
name = "no_tests"
path = "tests/no_tests.rs"
harness = false

[[test]]
name = "panic_location"
path = "tests/panic_location.rs"
harness = false

[[test]]
name = "stagger_output"
path = "tests/stagger_output.rs"
harness = false

[[test]]
name = "timeout_params"
path = "tests/timeout_params.rs"
harness = false


[features]
default = ["std", "bsx"]
std = [
	"bevy_color",
	"bevy/std",
	"bevy/bevy_log",
	"bevy/debug",
	"bytes/std",
	"either/use_std",
	"itertools/use_std",
	"thiserror/std",
	"tracing/std",
	"serde?/std",
	"serde_json?/std",
	"ron?/std",
	"futures-lite/race",
	# the async bridge is std-independent, but every std build wants it
	"bevy_async",
	"beet_async?/std",
	"dep:send_wrapper",
	"dep:async-lock",
	"dep:pathdiff",
	"dep:futures",
	"dep:async-channel",
	"dep:async-executor",
	"dep:async-io",
	"dep:async-task",
	# std builds want the full rand surface: `rand::rng()` (thread_rng) and the
	# std backends. Optional so non-rand std builds are unaffected.
	"rand?/std",
	"rand?/thread_rng",
	"uuid?/std",
]
# vendored bevy_async bridge + beet's high-level AsyncWorld/AsyncEntity layer.
# std-independent: only the default task spawner differs by target.
bevy_async = ["dep:beet_async"]
# no_std build for bare-metal targets (e.g. esp32): the libm / critical-section
# shims bevy needs without std. Capabilities like `bevy_color` are opt-in.
embedded = ["bevy/libm", "bevy/critical-section"]
ctrlc = ["dep:ctrlc"]
tokio = ["dep:tokio"]
nightly = []
testing = ["std", "dep:inventory"]
# no_std test runner for bare-metal targets (eg the esp32 firmware). Same
# `#[beet_core::test]` + matchers + `TestPlugin` as `testing`, but registers
# cases through a `linkme` distributed slice (inventory's ctors are dead on
# bare metal) and skips the std-only seams (snapshot fs, terminal control,
# env/argv parsing, `process::exit`). The host supplies the `critical-section`
# impl + an `AppExit` consumer. NOT `std`. Inert on wasm: linkme's link sections
# do not resolve there, so the registration path is cfg'd out and `testing`
# (inventory) is the only runner, which keeps `--all-features` buildable.
testing_embedded = [
	"dep:linkme",
	"dep:critical-section",
	"embedded",
	"bevy_async",
]
# Opt-in nightly path: the macro emits libtest `#[test]`s collected via
# `custom_test_frameworks`. Default builds use `inventory` on stable.
custom_test_frameworks = [
	"beet_core_macros/custom_test_frameworks",
	"testing",
	"nightly",
]
http = ["dep:http"]
crossterm = ["dep:crossterm", "dep:libc"]
bevy_default = ["template_serde", "bevy_multithreaded", "bevy_asset"]
# template serialization, see src/template_serde. needs reflect + Entity serde
template_serde = ["serde", "bevy/serialize"]
bevy_keyboard = ["bevy/keyboard"]
bevy_mouse = ["bevy/mouse"]
# the window-types layer (CursorMoved etc); does not pull winit, so a terminal
# host can synthesize the same cursor events winit would. On wasm it also links
# the browser canvas surface (`web_utils::wasm_canvas`) via the id-only
# raw-window-handle web handles.
bevy_window = ["bevy/bevy_window", "dep:raw-window-handle"]
bevy_reflect_documentation = ["bevy/reflect_documentation"]
bevy_multithreaded = ["bevy/multi_threaded"]
bevy_color = ["bevy/bevy_color"]
# Additive asset support for the template substrate: an asset path resolves to a
# `Handle` at build time and defers `Ready` until the asset finishes
# loading. The no_std core stays asset-free; removing this leaves a fully
# functional asset-free substrate where `Ready` fires immediately.
bevy_asset = ["bevy/bevy_asset"]
# no_std base serialization support. Heavier format crates (`ron`,
# `serde_plain`, json, postcard) are opt-in via their own features.
serde = [
	"bevy/serialize",
	"dep:serde",
	"smol_str/serde"
]
# RON text format, used by `MediaType::Ron` and `template_serde` loading.
ron = ["serde", "dep:ron"]
# Plaintext (de)serialization for `MediaType::Text` via serde_plain.
serde_plain = ["serde", "dep:serde_plain"]
json = ["serde", "dep:serde_json"]
postcard = ["serde", "dep:postcard"]
# no_std-capable RNG: `sys_rng` seeds `rand::make_rng()` from the platform
# entropy source via getrandom (a bare target installs a getrandom backend at
# boot), `chacha` supplies the `ChaCha8Rng` beet seeds from it, and `std` adds
# thread_rng. getrandom is named explicitly so its `wasm_js` backend feature is on.
rand = [
	"dep:rand",
	"rand/sys_rng",
	"rand/chacha",
	"rand/alloc",
	"dep:getrandom",
]

# Cross-platform uuid creation (`uuid_ext`). no_std-capable: the v7 timestamp
# comes from `time_ext`, not uuid's own std-only clock.
uuid = ["dep:uuid"]
# fs is std-only (notify/async-fs); it rides `uuid` for `tempdir`'s directory names.
fs = [
	"dep:notify",
	"dep:notify-debouncer-full",
	"dep:async-fs",
	"dep:async-process",
	"uuid",
]
tokens = [
	"serde",
	"dep:beet_core_shared",
	"dep:syn",
	"dep:quote",
	"dep:proc-macro2",
	"dep:prettyplease",
	"dep:proc-macro2-diagnostics",
]
rsx = ["beet_core_macros/rsx"]
# The hand-written BSX (`.bsx`) cursor parser and its resolution into the
# document-wired template tree (`src/bsx`). Default-on, gated only because it is
# a lot of code: an ultra-minimal build can drop it and keep the serde
# front-ends. The parser is no_std-capable; `register_dir` is additionally
# `fs`-gated, remote fetch `bevy_async`-gated, and JSON schemas `json`-gated.
bsx = ["serde"]


[dependencies]
beet_core_macros.workspace = true
beet_core_shared = { workspace = true, optional = true }
beet_async = { workspace = true, optional = true, default-features = false }
inventory = { workspace = true, optional = true }
# Bare-metal test registration (the `testing_embedded` feature); see its docs.
linkme = { workspace = true, optional = true }
critical-section = { workspace = true, optional = true }
bytes.workspace = true
bevy.workspace = true
bevy_reflect.workspace = true

#💡 utils
tracing.workspace = true
itertools = { workspace = true, features = ["use_alloc"] }
send_wrapper = { workspace = true, optional = true }
smol_str = { workspace = true }
heck.workspace = true
bitflags = { workspace = true }

#💡 http
http = {workspace = true,optional=true}


#💡 path
pathdiff = { version = "0.2", optional = true }
either = { version = "1", default-features = false }

#💡 serde
# Workspace serde is no_std (default-features off); `std` builds re-enable
# `serde/std` via the `std` feature. `alloc`/`rc` add the no_std collection impls.
serde = { workspace = true, optional = true, features = ["alloc", "rc"] }
serde_plain = {workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
postcard = { workspace = true, optional = true }
ron = { workspace = true, optional = true }


#💡 async
futures-lite = { workspace = true }
async-channel = { workspace = true, optional = true }
async-lock = { workspace = true, optional = true }

# tokens dependencies
syn = { workspace = true, optional = true }
quote = { workspace = true, optional = true }
proc-macro2 = { workspace = true, optional = true }
proc-macro2-diagnostics = { workspace = true, optional = true }
variadics_please = { workspace = true }
prettyplease = { workspace = true, optional = true }

# rand — workspace sets default-features = false so the `rand` feature is
# no_std-capable (bare embedded targets); the `rand` feature above selects
# `chacha` + `sys_rng`, and the `std` feature re-adds `rand/std` + `thread_rng`
# so std builds keep `rand::rng()`.
rand = { workspace = true, optional = true }
# rand 0.10's backend selector, declared so its `wasm_js` feature is on.
getrandom = { workspace = true, optional = true }
# workspace sets default-features = false so uuid compiles on no_std; `uuid/std`
# is re-added by the `std` feature.
# `js` (not `rng-getrandom`) supplies the wasm RNG: it keeps uuid off getrandom
# 0.4, whose `MaybeUninit` slice marshalling traps the test runner.
uuid = { workspace = true, optional = true, features = ["v4", "v7", "js"] }

## utils
thiserror.workspace = true
extend.workspace = true
futures = { workspace = true, optional = true }


[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
## async
crossterm = { workspace = true, optional = true }
# stdout/stderr fd redirection for `terminal_ext::redirect_std_to_file`, used by
# the live TUI to keep logs off the alternate screen. Tied to `crossterm` since
# both are terminal concerns enabled together by tui targets.
libc = { workspace = true, optional = true }
async-executor = { workspace = true, optional = true }
async-io = { workspace = true, optional = true }
async-task = { workspace = true, optional = true }
async-process = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

## fs
async-fs = { workspace = true, optional = true }
notify = { version = "8", optional = true }
notify-debouncer-full = { version = "0.7", optional = true }
ctrlc = { version = "3", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# force getrandom 0.3's `wasm_js` (WebCrypto) backend into the graph. The wasm
# rustflags select that backend unconditionally (see `.cargo/config.toml`), so any
# wasm build with getrandom anywhere in its graph — ahash pulls 0.3 even when
# beet's own `rand` feature is off — must also enable the matching feature or
# getrandom fails to compile. No beet crate wants 0.3 itself; it is declared here
# rather than per-crate since every beet crate depends on beet_core. 0.4 is the
# major beet's own `rand` feature rides, declared alongside it above.
getrandom_03 = { workspace = true }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
console_error_panic_hook.workspace = true
# the id-only `WebWindowHandle` the browser canvas surface stamps
# (`web_utils/wasm_canvas.rs`); activated by `bevy_window`.
raw-window-handle = { workspace = true, optional = true }
# tickable local executor for the bevy_async bridge: wasm's bevy `spawn_local`
# uses the JS event loop, which the synchronous sync-point driver cannot tick.
async-executor = { workspace = true, optional = true }
#https://rustwasm.github.io/wasm-bindgen/api/web_sys/
#https://github.com/rustwasm/wasm-bindgen/blob/main/crates/web-sys/Cargo.toml
web-sys = {workspace = true, features = [
	# HTML
	"Text",
	"Comment",
	"Node",
	"NodeList",
	"Document",
	"Element",
	"Window",
	"HtmlAnchorElement",
	"HtmlButtonElement",
	"HtmlCanvasElement",
	"HtmlDivElement",
	"HtmlHeadElement",
	"HtmlInputElement",
	"HtmlIFrameElement",
	"HtmlLinkElement",
	"HtmlParagraphElement",
	"HtmlScriptElement",
	# File
	"File",
	"FileList",
	# Blob
	'Blob',
	'BlobEvent',
	'BlobEventInit',
	'BlobPropertyBag',
	# Style
	"MediaQueryList",
	# Events
	"MouseEvent",
	"KeyboardEvent",
	# JS
	"console",
	"Navigator",
	"MediaDevices",
	"Performance",
	# Url
	"Url",
	"History",
	"Location",
	"UrlSearchParams",
	# Resize Observer
	"ResizeObserver",
	"ResizeObserverBoxOptions",
	"ResizeObserverEntry",
	"ResizeObserverOptions",
	"ResizeObserverSize",
	"DomRect",
	"DomRectReadOnly"
]}

[dev-dependencies]
beet_core = {path = ".", features=["testing", "rsx", "bsx", "json"] }
# beet_core = {path = ".", features=["testing", "rand", "json", "postcard"]}
