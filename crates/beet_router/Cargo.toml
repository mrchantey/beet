[package]
name = "beet_router"
version.workspace = true
edition.workspace = true
description = "Transport agnostic routing"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true


[features]
default = ["std"]
# The std render surface: the scene-rendering router pieces (help/navigate scene
# routes + rendering via `beet_ui`), media parsing, sidebar, help, the route tree,
# the runtime BSX parser, and the system-browser link opener (`open_link`, native
# only). Wasm-safe (eg the Cloudflare Worker render target): it deliberately omits
# the native-only filesystem store / http transport, which ride the separate
# `fs`/`http` features the native `router` pulls. The no_std core (route tree, path
# patterns, navigation, standalone middleware, server-action client) builds with this off.
std = [
	"beet_core/std",
	"beet_action/std",
	"beet_action/reflect",
	"beet_net/std",
	# the std surface (scene routes, render negotiation, stores) is
	# serde-saturated, mirroring beet_net's `std → serde`
	"serde",
	"dep:beet_ui",
	"beet_scene/std",
	"beet_ui/net",
	# documents parsed for media negotiation and scenes loaded, saved and managed
	"scene",
	# the std-gated `open_link` opens external links in the system browser on
	# native (the wasm render target uses `window.open`). `webbrowser` lives in the
	# non-wasm target table, so this activates it only off wasm; the no_std embedded
	# router leaves `std` off, keeping `webbrowser`/`url`/std out of the firmware.
	"dep:webbrowser",
	# beet_net/std has the socket core anyway, so std hosts get the socket-aware
	# scene management (`ResetOnDisconnect`) for free.
	"sockets",
]
# Socket-aware scene management (`ResetOnDisconnect`: a socket closure triggers
# `ResetScene`). no_std-capable; a bare-metal body enables it directly.
sockets = ["beet_net/sockets"]
# The native-only filesystem store + http transport, layered onto `std`. The
# native `router` enables this; the wasm render target leaves it off. (The
# `webbrowser` link opener rides `std` itself, off wasm — see the `std` feature.)
native = ["std", "beet_net/fs", "beet_net/http"]
# The Cloudflare Worker target (wasm32-only): the R2-backed store an entry loads
# from, and the world-owning `entry_build` driver the Worker's fetch handler runs.
cloudflare = ["std", "beet_net/cloudflare"]
# The S3-backed store: lets a deployed binary serve its routes from a
# bucket-backed `BlobStore`.
aws = ["std", "beet_net/aws"]
interface = ["serde"]
# The entry's `<Secrets>` declarations loaded into the process environment
# before the entry builds (the prescan's half of `beet_net/vault`), so every
# declaration constructed in the build walk finds its credentials set.
vault = ["std", "beet_net/vault"]
json = ["serde", "beet_core/json", "beet_net/json", "beet_scene?/json"]
# The standard.site records (`router/site/syndication/standard_site`): plain
# data in the atproto model, beside `beet_net`'s `Pds` family.
dag_cbor = ["serde", "beet_core/dag_cbor", "beet_net/dag_cbor"]
# The optional standard site content formats (`standard_site/leaflet/`),
# Leaflet today: a page rendered as `pub.leaflet.content` through the lexicon
# registries, json on the wire, its image blocks reading an image's size off
# its header (`imagesize`). Never a publication's default, and no deployed
# binary carries it.
standard_site_extra = ["dag_cbor", "json", "dep:imagesize"]
# The network half of the standard.site records: an article's comments, the
# replies to its announcement read live from the Bluesky AppView
# (`<StandardSiteComments/>`). Without it the comments island fails over to
# its fallback, the link to reply on Bluesky. And the publish sequence, which
# writes each document's `content` as a scene (`org.beet.scene#body`) by
# default, so it carries the scene lexicon (`scene`).
atproto = ["dag_cbor", "json", "scene", "beet_net/atproto"]
# Deriving the site's images: an `<IconSet/>`'s files from its source image
# (decode, resize and encode through `image`, `ico` for the multi-size favicon,
# svg rasterisation through `resvg`) and a `<SocialCards/>` set (an svg per
# page rendered by `resvg`, its text wrapped by `skrifa`'s glyph advances).
# Only the binary that runs `<Derive/>` needs it; the served site reads the
# declarations for its head links without it.
site_images = ["std", "json", "dep:image", "dep:resvg", "dep:skrifa"]
postcard = ["serde", "beet_core/postcard", "beet_net/postcard"]
serde = ["dep:serde", "beet_core/serde", "beet_action/serde", "beet_net/serde", "beet_ui?/serde"]
markdown = ["std", "beet_ui/markdown"]
# Word files, workbooks and slide decks as media (`beet_ui/ooxml`), every
# router installing `OoxmlPlugin` so a route serves and writes them.
ooxml = ["std", "beet_ui/ooxml"]
# The live, interactive terminal target: the charcell TUI host + stdio terminal,
# behind which the in-world `Navigator` browses the app's own routes (`TuiServer`).
tui = ["std", "beet_ui/tui"]
# A mermaid diagram (`beet_ui/mermaid`) read as the fence it was written as,
# by a target that writes the source rather than the picture (Leaflet).
mermaid = ["std", "beet_ui/mermaid"]
# The multi-tenant SSH-TUI server (`SshTuiServer`): serves each SSH connection its
# own navigable terminal, all browsing the same router, alongside the http server.
ssh = ["tui", "beet_net/russh_server"]
# The `#[ignore]`d SSH multi-tenancy stress harness, which drives real client
# sessions against a real listener: nothing in the library is gated on it, it
# only adds the client half of the transport the `ssh` feature serves.
ssh_stress = ["ssh", "beet_net/russh_client"]
http = ["std", "beet_net/server"]
# The server-to-client websocket channel (`ClientIo`) and the dev-mode
# `LiveReload` watcher built on it. Native-only: no HTTP backend supports
# websocket upgrades, so the channel runs a tungstenite listener on its own
# port beside the HTTP server.
client_io = ["http", "beet_net/tungstenite"]
# Scenes loaded, served and swapped (`SceneServer`, `ResetScene`) through
# `beet_scene`, no_std as it is. `beet_core/rsx`: the `SceneServer` meta-route
# bundle is a `#[template]`, whose attribute macro is rsx-gated.
scene = ["dep:beet_scene", "beet_scene/bsx", "beet_core/rsx", "beet_ui?/scene", "serde"]
# The scripting route registrations (the `Script`/`ExchangeScript`/
# `ExchangeScriptElement` reflect types and the `<ScriptRoute>` template).
# Backend-agnostic and self-sufficient: this compiles and registers on its own,
# and a route only errors if it is dispatched in a build with no backend.
# A script marshals its values as json in both directions, so the scripted
# route surfaces ride that gate rather than half-existing without it.
# `beet_ui?/scripting` is the `bx:on<event>` runner: where beet_ui is present a
# scripting build is one whose event handlers actually run. The scripted route
# surfaces (`ExchangeScript`, `<ScriptRoute>`, `ExchangeScriptElement`) register
# with the std router plugin, so they ride `std` too; a no_std router with
# `scripting` gets the engine and none of them.
scripting = ["beet_action/scripting", "beet_ui?/scripting", "serde", "json"]
# The embedded QuickJS backend for the scripting registrations above.
quickjs = ["scripting", "beet_action/quickjs", "beet_ui?/quickjs"]
# Build-time code generation: route tree, server/client actions, typed links.
# The collection scan reads a content file's root declarations through the doc
# parsers exactly as `RoutesDir` discovery does, so blob routes are emitted
# with the declarations they hoist: `scene` reads markup roots and markdown
# frontmatter alike, no markdown content parser required.
codegen = [
	"std",
	"serde",
	"scene",
	"beet_core/tokens",
	"beet_net/tokens",
	"dep:syn",
	"dep:quote",
	"dep:proc-macro2",
	"dep:prettyplease",
	"dep:heck"
]

[dependencies]
# `rsx` is macro-only (it just enables `beet_core_macros/rsx`) and non-optional:
# the no_std core authors `<Route>` as a `#[template]`, so the attribute has to be
# in scope even in a build with no markup surface at all.
beet_core = { workspace = true, default-features = false, features = ["bevy_async", "rsx"] }
beet_action = { workspace = true, default-features = false }
# `action`: every build dispatches a request down the route tree through
# `AsyncExchangeExt`, which rides beet_net's no_std `action` feature
beet_net = { workspace = true, default-features = false, features = ["action"] }
# std-only: the template/render pipeline backing template routes, media, help, sidebar.
beet_ui = { workspace = true, optional = true, features = ["action", "template"] }
# the documents a page, a layout or an entry is and instantiates
beet_scene = { workspace = true, optional = true }
bevy.workspace = true
extend.workspace = true
thiserror.workspace = true
variadics_please.workspace = true
bitflags = "2"

serde = {workspace = true, optional=true}
# the raster formats the web serves, for a Leaflet image block's aspect ratio
imagesize = { workspace = true, optional = true, features = ["png", "jpeg", "gif", "webp", "heif", "bmp", "tiff", "ico"] }
# an icon set's source decoded, each size resized and encoded
image = { workspace = true, optional = true, features = ["png", "jpeg", "webp", "ico"] }
# an svg icon source rasterised at each size rather than traced, and a social
# card drawn
resvg = { workspace = true, optional = true }
# a social card's text measured by its glyph advances
skrifa = { workspace = true, optional = true }

#💡 codegen
syn = { workspace = true, optional = true }
quote = { workspace = true, optional = true }
proc-macro2 = { workspace = true, optional = true }
prettyplease = { workspace = true, optional = true }
heck = { workspace = true, optional = true }

# the system-browser link opener (`open_external_link`). Optional, enabled by the
# `std` feature (the std render surface compiles `open_link`), and in the non-wasm
# target table — the wasm render target records the open intent via the event but
# has no system browser, so it is excluded there. Optional so the no_std embedded
# router (`std` off) keeps `webbrowser`/`url`/std out of the firmware build.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
webbrowser = { workspace = true, optional = true }

[dev-dependencies]
# `fs` + `rand`: the entry-resolution tests walk a real `TempDir` (which the
# `rand` feature mints the name of), since a store walk is exactly what they are
# asserting.
beet_core = { workspace = true, features = ["testing", "fs", "rand"] }
# the standard.site tests read a record's wire form, json, in every build
# carrying the records, `json` or not

# `ureq` + `server`: the http store test reads a `<ServeBlobs>` mount over a
# real listener, which needs a client transport beside the mini server.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
beet_net = { workspace = true, features = ["ureq", "server"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]




# [[test]]
# name = "interface"
# path = "tests/interface.rs"
# required-features = ["interface"]

[[test]]
name = "beetmania"
path = "tests/beetmania.rs"
harness = false
required-features = ["markdown"]

[lib]
harness = false
