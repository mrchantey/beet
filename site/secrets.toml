[groups.default.secrets.AWS_ACCESS_KEY_ID]
role = "env_var"
note = "aws deploy credential `beet-site-deploy`: the access key id of the `beet-site` entry's own iam user; its deploy verbs read the pair from here, never from ~/.aws"
modified = "2026-11-20T10:19:55.414Z"
roll = "elevated"

[groups.default.secrets.AWS_ACCESS_KEY_ID.metadata]
