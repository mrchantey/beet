account_name = "beet"
entry = "beet-site"
grants = """
beet-site--deploy 19517eed49f23d9a
beet-site--dev--runtime-boundary 99fd30eef103e7e6
beet-site--prod--runtime-boundary cf3a99344ce3b554
beet-social--deploy d441aaee7b157b3f"""

[groups.default.secrets.AWS_SECRET_ACCESS_KEY]
role = "env_var"
note = "aws deploy credential `beet-site-deploy`: the secret half of AWS_ACCESS_KEY_ID, shown once at creation"
modified = "2026-11-20T10:19:55.415Z"
roll = "elevated"

[groups.default.secrets.BEET_SSH_HOST_KEY]
role = "env_var"
note = "ssh host key of the site box (base64 of the ssh-keygen file): a local serve reads it here, and every full deploy of a stage writes it as the write-only value of the stack's tofu parameter /beet-site/<stage>/ssh-host-key (in no rendered config, plan or state), where the box reads it at each start"
modified = "2026-11-20T05:05:58.707Z"
roll = """
manual:ssh-keygen -t ed25519 -N '' -C beet-site -f <mode 700 tmp dir>/key
> base64 -w0 <dir>/key | beet --entry=site secrets/set BEET_SSH_HOST_KEY --role=env_var --note=.. --roll=.. (set restates the note and roll), then delete the dir
> deploy each live stage (just beet-deploy, just beet-deploy --stage=prod): the full apply rewrites the stack's write-only parameter, versioned by this record's modified, and the release restarts the box onto it, no rebuild
> ssh-keygen -R app.beet.org (and app.dev.beet.org) for clients that pinned the old key"""

[groups.default.secrets.CLOUDFLARE_API_TOKEN]
role = "env_var"
note = "cloudflare deploy token `beet-site-deploy` (684c624d67c6446e926077427bed4404): account-owned, scoped to exactly what the `beet-site` entry's stacks and routes declare; every tofu apply, wrangler call and zone verb it runs reads it from here"
modified = "2026-11-20T10:21:28.077Z"
roll = "elevated"

[groups.default.secrets.CLOUDFLARE_API_TOKEN.metadata]
entry = "beet-site"
grants = """
Zone > Cache Purge on beet.org
Zone > Cache Settings Write on beet.org
Zone > DNS Write on beet.org
Zone > Dynamic URL Redirects Write on beet.org
Zone > Zone Settings Write on beet.org
lifetime: until rolled
usable from: any address"""

[groups.default.secrets.TF_STATE_PASSPHRASE]
role = "env_var"
note = "opentofu client-side state encryption for the site entry's stacks (the site, shared, social): state carries what an apply derives. Copied from the repo's secrets.toml, whose value it still is until rolled"
modified = "2026-11-20T05:05:57.551Z"
roll = """
manual:not re-mintable: losing it loses every stack's state, and a new one cannot read what the old one wrote
> beet --entry=site secrets/set TF_STATE_PASSPHRASE_OLD --copy=TF_STATE_PASSPHRASE --role=env_var
> beet --entry=site secrets/set TF_STATE_PASSPHRASE --generate --role=env_var --note=.. --roll=.. (set restates the note and roll)
> roll-state on every stack (just site-shared roll-state, beet-roll-state --stage=prod, site-social roll-state --stage=prod); a stack still plaintext is encrypted by the same verb
> plan each stack straight after its own roll: the plan is the proof the state still reads, and a silent failure would leave the next roll operating on an unknown
> beet --entry=site secrets/rm TF_STATE_PASSPHRASE_OLD once every stack has planned"""

