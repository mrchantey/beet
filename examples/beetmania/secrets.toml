[groups.default.secrets.TF_STATE_PASSPHRASE]
role = "env_var"
note = "opentofu client-side state encryption for this example's stacks (beetmania, beetmania-social): state carries what an apply derives"
modified = "2026-11-20T11:48:44.280Z"
roll = """
manual:not re-mintable: losing it loses both stacks' state, and a new one cannot read what the old one wrote
> just beetmania secrets/set TF_STATE_PASSPHRASE_OLD --copy=TF_STATE_PASSPHRASE --role=env_var
> just beetmania secrets/set TF_STATE_PASSPHRASE --generate --role=env_var --note=.. --roll=.. (set restates the note and roll)
> roll-state on both stacks (just beetmania roll-state --stage=prod, just beetmania social roll-state --stage=prod)
> plan each stack straight after its own roll: the plan is the proof the state still reads
> just beetmania secrets/rm TF_STATE_PASSPHRASE_OLD once both have planned"""

